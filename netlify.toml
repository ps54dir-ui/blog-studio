[build]
  publish = "files (5)"
  # v10 지침은 레포 루트 guidelines/에 두고, 배포 루트(files (5))로 복사 → /guidelines/v10/*.md 200
  command = "mkdir -p \"files (5)/guidelines/v10\" && cp -r guidelines/v10/. \"files (5)/guidelines/v10/\" && node scripts/inject-google-client-id.cjs"
  # index.html, blog-studio-v7.html, admin.html이 루트에 있도록 함
  # GOOGLE_CLIENT_ID 가 있으면 빌드 시 index.html 에 SITE_GOOGLE_CLIENT_ID 로 주입 (Functions 없어도 로그인 가능)

[functions]
  directory = "netlify/functions"

# 브라우저는 /api/... 로 호출 — Functions로 프록시 (OPENAI_API_KEY 등은 Netlify 환경변수)
[[redirects]]
  from = "/api/openai/chat"
  to = "/.netlify/functions/openai-chat"
  status = 200
  force = true

[[redirects]]
  from = "/api/anthropic/messages"
  to = "/.netlify/functions/anthropic-messages"
  status = 200
  force = true

[[redirects]]
  from = "/api/shared-guidelines"
  to = "/.netlify/functions/shared-guidelines"
  status = 200
  force = true

# 브라우저 Google 로그인: GOOGLE_CLIENT_ID 등은 Netlify 환경 변수
[[redirects]]
  from = "/api/blog-studio/google-client-config"
  to = "/.netlify/functions/blog-studio-google-client-config"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
